[workspace]
resolver = "2"
members = [
    "crates/nv-store",
    "crates/boot",
    "crates/component-mgr",
    "crates/host-os-mgr",
    "crates/app-mgr",
    "crates/machine-mgr",
    "crates/vm-service",
    "crates/hsm",
    "crates/hsm-contract",
    "crates/hsm-link-b",
    # sumo-verify deliberately STAYS in runtime crates/ — it is a DEPLOYED
    # launch gate (the supernova CI runtime bundle ships it next to vhsm-ssd,
    # and the start script invokes it before launching each component), not
    # developer tooling.
    "crates/sumo-verify",
    "crates/policy-eval",
    "crates/policy-partition",
    "crates/vhsm-ssd",
    "crates/vm-wire",
    "crates/vm-devices",
    "crates/secstore",
    "crates/component-factory",
    "crates/host-metrics",
    "crates/log-rotate",
    "crates/puller",
    "crates/hsm-rustls",
    "crates/vhsm-proto",
    "crates/vhsm-client",
    "crates/vhsm-provider",
    "crates/vhsm-crossnode-client",
    "crates/vm-sovd",

    # Dev / offboard tooling, grouped under tools/crates/ to keep it separate
    # from the runtime crates/ above. Of the once-pending relocation candidates,
    # ca-bundle-build, policy-build and sumo-factory-reset-mint moved here
    # (offboard image builders / dev token minter, run by developers and CI);
    # sumo-verify stayed in crates/ — see its note above.
    # Build read-only CA-bundle images shipped as per-VM SUIT components.
    "tools/crates/ca-bundle-build",
    "tools/crates/hsm-conformance",
    # Software-HSM (SimHsm) backend + the `hsm-sim-service` link-B bin (was the
    # sim half of the `hsm` crate; S7b relocated it here). Not merely test
    # tooling: sim/dev deployments run it as their HSM — see its crate docs.
    "tools/crates/hsm-sim-backend",
    # Build read-only policy images (squashfs / qnx6) for the policy partition.
    "tools/crates/policy-build",
    # Dev factory-reset capability-token minter (well-known dev key).
    "tools/crates/sumo-factory-reset-mint",
]

[profile.release]
# Strip the symbol table from release binaries — keeps the deployed binaries
# (vm-sovd, vhsm-ssd, the t2-seed-cicd layer binaries) slim, which matters for
# the qnx6 layer-image sizes + the device rootfs. Cargo runs the right
# per-target strip via `rustc -Cstrip=symbols`. Mirrors guest-vm-sdk and
# the host machine manager (which also strip their release builds).
strip = "symbols"

# QNX (nto) cross-compile patch. vhsm-ssd's cross-node mTLS listener pulls in
# rustls → ring, whose `SystemRandom` only implements `SecureRandom` on nto with
# the upstream "add qnx support" commit (briansmith/ring#2740), not yet in a
# tagged release. vhsm-ssd is built FROM THIS workspace for QNX (the host
# machine manager's QNX example build runs `cd sumo-machine-manager
# && cargo build -p vhsm-ssd --target aarch64-unknown-nto-qnx710`), and a
# [patch] only applies to its own workspace root — so it must live here too, not
# only in the host's Cargo.toml. It is ring 0.17.14 + the nto cfg line, so it is
# byte-for-byte the released crate on non-nto targets (the new code is cfg-gated
# to target_os = "nto").
[patch.crates-io]
ring = { git = "https://github.com/briansmith/ring", rev = "d018db62e1a4a92689611c86d33d6a85939197c4" }
