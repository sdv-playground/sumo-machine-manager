[workspace]
resolver = "2"
members = [
    "crates/nv-store",
    "crates/boot",
    "crates/component-mgr",
    "crates/host-os-mgr",
    "crates/app-mgr",
    "crates/machine-mgr",
    "crates/vm-mgr",          # VM lifecycle library (was `vm-service` — that name is the PROCESS)
    "crates/hsm",
    "crates/hsm-contract",
    "crates/hsm-link-b",
    "crates/policy-eval",
    "crates/policy-partition",
    "crates/vm-wire",
    "crates/vm-devices",
    "crates/secstore",
    "crates/component-factory",
    "crates/host-metrics",
    "crates/log-rotate",
    # --- platform-integration tier (NOT machine-manager internals) -----------
    # Shared logging glue used by BOTH the host (supernova + host binaries) and
    # the guest (services via sumo-log; the log-agent over platform-log). Lives
    # here because sumo-mm is the only upstream both host and guest already
    # git-dep (like vm-wire / hsm-contract). Candidate to extract into a
    # dedicated `platform-integration` repo later — see
    # tasks/platform-integration-grouping.md.
    "crates/platform-integration/score-log-tracing", # tracing → score_log bridge
    "crates/platform-integration/score-log-slog2",   # score_log → QNX slog2 recorder
    "crates/platform-integration/sumo-log",          # fleet logging init (env-selected recorder)
    "crates/platform-integration/platform-log",      # shared log readers (files, journald, bulk-data)
    # -------------------------------------------------------------------------
    "crates/puller",
    "crates/hsm-rustls",
    "crates/vhsm-proto",
    # The vHSM server LIBRARY (was `vhsm-ssd`, which is now the daemon in
    # services/ — see that crate's note on why the daemon kept the name).
    "crates/vhsm-server",
    "crates/vhsm-client",
    "crates/vhsm-provider",
    "crates/vhsm-crossnode-client",

    # --- services/ — ON-DEVICE DEPLOYABLES (docs/componentization.md item 3d) --
    # Three buckets: crates/ = consumable libraries (someone DEPENDS on it),
    # services/ = on-device deployables (someone RUNS it on a target), tools/ =
    # host-side CLIs and build/dev tooling (someone runs it on a workstation or
    # in CI). A deployable is not SDK surface, so it does not belong next to
    # nv-store and machine-mgr — and a `[[bin]]` sharing its crate's
    # [dependencies] is how library consumers silently inherit binary deps.
    #
    # slog2-drainer was the PILOT that proved the premise: supernova installs it
    # BY PACKAGE NAME over git (`cargo install --git … slog2-drainer`), so cargo
    # resolves against the workspace, not the directory — the move is invisible
    # to consumers, and Cargo.lock is byte-unchanged by it. Every move below
    # rides on that proof (docs/componentization.md, item 3d Feasibility).
    "services/slog2-drainer",                        # Tier-2 host: drain slog2 ring → sealed disk segments
    "services/sumo-verify",                          # launch gate: external secure boot / start script runs it per component
    "services/vhsm-ssd",                             # the vHSM daemon guests reach over /dev/vhsm (supernova installs it BY NAME)
    "services/vm-sovd",                              # the SOVD/OTA HTTP server (3c splits it into its two halves)
    # -------------------------------------------------------------------------

    # Dev / offboard tooling, grouped under tools/crates/ to keep it separate
    # from the runtime crates/ above. Of the once-pending relocation candidates,
    # ca-bundle-build, policy-build and sumo-factory-reset-mint moved here
    # (offboard image builders / dev token minter, run by developers and CI);
    # sumo-verify has since moved to services/ (item 3d) — it is a DEPLOYED launch
    # gate, which is a third bucket, not "not developer tooling".
    # Build read-only CA-bundle images shipped as per-VM SUIT components.
    "tools/crates/ca-bundle-build",
    "tools/crates/hsm-conformance",
    # Prometheus EXPORTER over the host-metrics library (dev/standalone only — in
    # production supernova embeds the library and serves on its own bind). Split
    # out by item 3d: the runner owns the tokio runtime + signal handling +
    # sumo-log init, none of which a library consumer should inherit.
    "tools/crates/host-metrics-exporter",
    # The `vm-service` PROCESS — runner over the vm-mgr library, the dev/Linux
    # path (example/dummy-vm/run-vm.sh). On a device supernova embeds VmManager
    # in-process, so this binary is not deployed. Split out by item 3d (the old
    # bin re-declared every library module, compiling the crate twice); the
    # follow-up rename gave the process the name and the library `vm-mgr`, so
    # neither needs a suffix to disambiguate from the other.
    "tools/crates/vm-service",
    # The NV/bank + factory-ops CLI over the component-mgr library (dev/CI only:
    # build-all.sh and example/run.sh run it from target/debug). Split out by
    # item 3d for the bucket rule — measured closure win here is ZERO, the bin
    # uses nothing the library does not already need. Renamed from
    # `vm-diagserver`: it is a CLI, not a server, and the old name needed a
    # footnote in two docs to undo.
    "tools/crates/vm-diagctl",
    # Software-HSM (SimHsm) backend + the `hsm-sim-service` link-B bin (was the
    # sim half of the `hsm` crate; S7b relocated it here). Not merely test
    # tooling: sim/dev deployments run it as their HSM — see its crate docs.
    "tools/crates/hsm-sim-backend",
    # Build read-only policy images (squashfs / qnx6) for the policy partition.
    "tools/crates/policy-build",
    # Dev factory-reset capability-token minter (well-known dev key).
    "tools/crates/sumo-factory-reset-mint",
]

[profile.release]
# Strip the symbol table from release binaries — keeps the deployed binaries
# (vm-sovd, vhsm-ssd, the t2-seed-cicd layer binaries) slim, which matters for
# the qnx6 layer-image sizes + the device rootfs. Cargo runs the right
# per-target strip via `rustc -Cstrip=symbols`. Mirrors guest-vm-sdk and
# the host machine manager (which also strip their release builds).
strip = "symbols"

# QNX (nto) cross-compile patch. vhsm-ssd's cross-node mTLS listener pulls in
# rustls → ring, whose `SystemRandom` only implements `SecureRandom` on nto with
# the upstream "add qnx support" commit (briansmith/ring#2740), not yet in a
# tagged release. vhsm-ssd is built FROM THIS workspace for QNX (the host
# machine manager's QNX example build runs `cd sumo-machine-manager
# && cargo build -p vhsm-ssd --target aarch64-unknown-nto-qnx710`), and a
# [patch] only applies to its own workspace root — so it must live here too, not
# only in the host's Cargo.toml. It is ring 0.17.14 + the nto cfg line, so it is
# byte-for-byte the released crate on non-nto targets (the new code is cfg-gated
# to target_os = "nto").
[patch.crates-io]
ring = { git = "https://github.com/briansmith/ring", rev = "d018db62e1a4a92689611c86d33d6a85939197c4" }
