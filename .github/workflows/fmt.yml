name: fmt
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      # This crate path-deps sibling repos (../sumo-rs, ../SOVDd) that CI doesn't
      # check out, so `cargo fmt --all` fails at `cargo metadata` ("failed to read
      # ../sumo-rs/.../Cargo.toml") before rustfmt ever runs. rustfmt needs none of
      # those deps — format the tracked .rs files directly. rustfmt.toml (edition
      # 2021) is auto-discovered from the repo root.
      - run: git ls-files '*.rs' | xargs -r rustfmt --edition 2021 --check
