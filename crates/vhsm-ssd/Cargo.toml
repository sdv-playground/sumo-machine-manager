[package]
name = "vhsm-ssd"
version = "0.1.0"
edition = "2021"
description = "vHSM Secure Storage Daemon — host-side crypto service for guest VMs"

[dependencies]
hsm = { path = "../hsm", features = ["crypto"] }
vhsm-proto = { path = "../vhsm-proto" }
policy-eval = { path = "../policy-eval" }
policy-partition = { path = "../policy-partition" }
secstore = { path = "../secstore" }
log-rotate = { path = "../log-rotate" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["verifying", "der"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
# CWT (RFC 8392) certs + COSE_Sign1 signatures for the IAM identity
# layer (cert.rs). Already transitive via hsm; making the dep direct
# so cert.rs can address ciborium::value / coset::CoseSign1 without
# going through hsm's re-exports.
ciborium = "0.2"
coset = "0.3"
sha2 = "0.10"
# SIGTERM/SIGINT backend reaper (main.rs): block the signals, then `sigwait`
# in a dedicated thread that owns the spawned link-B backend `Child` and
# kills + reaps it before exit so a clean stop doesn't orphan it. Already in
# the dependency tree transitively; named directly so main can call it.
libc = "0.2"
# Cross-node mTLS transport (tls.rs): HSM-backed server identity via hsm-rustls,
# sync rustls (ring) to match the std::net accept loop.
hsm-rustls = { path = "../hsm-rustls" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# Cross-node principal derivation (crossnode.rs): parse the verified mTLS client
# leaf and read its subject CN as the node id. const-oid `db` names COMMON_NAME.
x509-cert = { version = "0.2", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
rand = { version = "0.8", features = ["std"] }
tempfile = "3"
# Build test certs (a test identity root + leaves) for the mTLS loopback test.
x509-cert = { version = "0.2", features = ["std", "pem", "builder"] }
const-oid = { version = "0.9", features = ["db"] }
sha2 = { version = "0.10", features = ["oid"] }
# Full-daemon e2e (tests/full_daemon_e2e.rs): drive the REAL vhsm-ssd binary
# the way a guest does — the v3 CWT handshake (enroll → authenticate) plus
# crypto ops — through the actual guest wire client. `guest-auth` pulls in the
# HELLO/AUTH/ENROLL layer. (The dev-dependency cycle vhsm-ssd <-> vhsm-client
# is permitted by Cargo since the normal dependency graph stays acyclic.)
vhsm-client = { path = "../vhsm-client", features = ["guest-auth"] }

[[bin]]
name = "vhsm-ssd"
path = "src/main.rs"
