[package]
name = "vhsm-ssd"
version = "0.1.0"
edition = "2021"
description = "vHSM Secure Storage Daemon — host-side crypto service for guest VMs"

[dependencies]
hsm = { path = "../hsm", features = ["crypto"] }
policy-eval = { path = "../policy-eval" }
policy-partition = { path = "../policy-partition" }
secstore = { path = "../secstore" }
log-rotate = { path = "../log-rotate" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["verifying", "der"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
# CWT (RFC 8392) certs + COSE_Sign1 signatures for the IAM identity
# layer (cert.rs). Already transitive via hsm; making the dep direct
# so cert.rs can address ciborium::value / coset::CoseSign1 without
# going through hsm's re-exports.
ciborium = "0.2"
coset = "0.3"
sha2 = "0.10"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
rand = { version = "0.8", features = ["std"] }
tempfile = "3"

[[bin]]
name = "vhsm-ssd"
path = "src/main.rs"
