[package]
name = "vhsm-server"
version = "0.1.0"
edition = "2021"
# Renamed from `vhsm-ssd` by docs/componentization.md item 3d. The DAEMON keeps
# that name — it is what consumers address (`cargo install … vhsm-ssd`, the
# process on the device, the `aud` claim "vhsm-ssd" in vhsm-proto) and it now
# lives in services/vhsm-ssd. This crate is the reusable server half: the v3
# wire codec, handle table, CWT/IAM auth, dispatch, transport and TLS. Naming it
# for the family it belongs to (vhsm-proto / vhsm-client / vhsm-provider /
# vhsm-crossnode-client) is what let the split happen with ZERO churn for any
# consumer — the alternative, renaming the binary's package, would have needed a
# coordinated edit in supernova-machine-manager's CI.
description = "vHSM server library — v3 handle-based wire protocol, CWT/IAM identity, dispatch and transport for the host-side crypto service. The daemon that runs it is services/vhsm-ssd."

[dependencies]
hsm = { path = "../hsm", features = ["crypto"] }
vhsm-proto = { path = "../vhsm-proto" }
policy-eval = { path = "../policy-eval" }
policy-partition = { path = "../policy-partition" }
secstore = { path = "../secstore" }
log-rotate = { path = "../log-rotate" }
tracing = "0.1"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["verifying", "der"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
# CWT (RFC 8392) certs + COSE_Sign1 signatures for the IAM identity
# layer (cert.rs). Already transitive via hsm; making the dep direct
# so cert.rs can address ciborium::value / coset::CoseSign1 without
# going through hsm's re-exports.
ciborium = "0.2"
coset = "0.3"
sha2 = "0.10"
# Cross-node mTLS transport (tls.rs): HSM-backed server identity via hsm-rustls,
# sync rustls (ring) to match the std::net accept loop.
hsm-rustls = { path = "../hsm-rustls" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# Cross-node principal derivation (crossnode.rs): parse the verified mTLS client
# leaf and read its subject CN as the node id. const-oid `db` names COMMON_NAME.
x509-cert = { version = "0.2", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
rand = { version = "0.8", features = ["std"] }
tempfile = "3"
# Build test certs (a test identity root + leaves) for the mTLS loopback test.
x509-cert = { version = "0.2", features = ["std", "pem", "builder"] }
const-oid = { version = "0.9", features = ["db"] }
sha2 = { version = "0.10", features = ["oid"] }
# SimHsm backend for the in-process tests + tests/backend_link_b.rs, which
# spawns the `hsm-sim-service` bin. (The two binary-driven e2e tests moved to
# services/vhsm-ssd with the daemon — they need CARGO_BIN_EXE_vhsm-ssd.)
hsm-sim-backend = { path = "../../tools/crates/hsm-sim-backend" }
