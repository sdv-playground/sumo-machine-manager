[package]
name = "hsm"
version = "0.1.0"
edition = "2021"
description = "HSM provider/crypto contract: traits, types, KeyRole, keystore schema, IVD signing, and the link-B bridge"

[dependencies]
tracing = "0.1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
coset = { version = "0.3", default-features = false }
# The slot registry (handle ↔ key_id ↔ alg ↔ perms) is single-sourced here;
# KeyRole maps each role to a handle and derives key_id() from the registry.
vhsm-proto = { path = "../vhsm-proto" }
# The shared HSM crypto contract (handle-addressed HsmCryptoProvider + the
# HsmError/KeyInfo/KeyType/KeyHandle types). hsm re-exports these; concrete
# backends (hsm-sim-backend's SimHsm, the vendor HSE) implement them.
hsm-contract = { path = "../hsm-contract" }
# Link-B wire contract (frame codec + OP_*/ST_*/KEYTYPE_* constants). The
# `link_b` module bridges HsmCryptoProvider <-> the link-B service over it.
hsm-link-b = { path = "../hsm-link-b" }

# SUIT manifest validation for the `key_unwrap` HSM-backed KeyUnwrap adapter.
sumo-onboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3", optional = true }

# RustCrypto — `ivd` (SHA-256 bank hashing) and the SPKI→COSE_Key converter
# (`link_b::cose_key_es256_from_spki_der`). `asm` enables the hardware-
# accelerated SHA-256 backend (what the IVD bank verify is bound by); on QNX it
# also needs `-C target-feature=+sha2` at build time.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "std"], optional = true }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"], optional = true }
sha2 = { version = "0.10", features = ["asm", "oid"], optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["suit"]
suit = ["dep:sumo-onboard"]
crypto = ["dep:p256", "dep:ecdsa", "dep:sha2", "dep:rand"]
