[package]
name = "machine-mgr"
version = "0.1.0"
edition = "2021"
description = "Machine + Component traits — semantic API behind diagserver, swappable real/sim impls"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
nv-store = { path = "../nv-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
