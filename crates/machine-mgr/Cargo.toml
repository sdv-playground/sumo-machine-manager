[package]
name = "machine-mgr"
version = "0.1.0"
edition = "2021"
description = "Machine + Component traits — semantic API behind diagserver, swappable real/sim impls"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
nv-store = { path = "../nv-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Our own unit tests use the in-memory selector seams; the re-declaration
# enables them for test builds only (cargo unifies dev-features there).
nv-store = { path = "../nv-store", features = ["test-seams"] }

[features]
# Forward nv-store's in-memory selector test seams (`InMemorySelectorStore` /
# `TestSigner`) through this crate's re-exports. Test builds only — downstream
# cfg(test) users enable it via a [dev-dependencies] re-declaration.
test-seams = ["nv-store/test-seams"]
