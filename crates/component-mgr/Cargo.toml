[package]
name = "component-mgr"
version = "0.1.0"
edition = "2021"

[dependencies]
nv-store = { path = "../nv-store" }
machine-mgr = { path = "../machine-mgr" }
# Shared log readers (platform-integration). Provides read_slog2 for the host's
# LogSource::Slog2 — the QNX slogger2 ring reader (supernova + driver telemetry).
platform-log = { path = "../platform-integration/platform-log" }
sha2 = "0.10"
crc32fast = "1"
bytes = "1"
futures = "0.3"
# Native libzstd (C). Pure-Rust ruzstd decompressed the OTA rootfs at only
# ~45 MB/s on the A53 (the #2 upload cost after decrypt); libzstd is ~10x.
zstd = "0.13"
coset = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
sovd-api = { git = "https://github.com/sdv-playground/SOVDd.git", branch = "main" }
sumo-onboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-processor = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-crypto = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-codec = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
hsm = { path = "../hsm", features = ["crypto"] }
# The software-HSM (SimHsm) CSR/IVD fallback in component_adapter.rs +
# factory-init's `--hsm-keystore` bring-up (main.rs) — the sim/dev HSM mode.
# Hardware production reaches a vendor HSM service over link-B instead.
hsm-sim-backend = { path = "../../tools/crates/hsm-sim-backend" }
host-os-mgr = { path = "../host-os-mgr" }
app-mgr = { path = "../app-mgr" }
# Content-addressed fleet-repo pull (onboard/fleet PULL payload fetch).
puller = { path = "../puller" }
hex = "0.4.3"
base64 = "0.22"
jsonwebtoken = "10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
x509-cert = { version = "0.2", features = ["std", "pem", "builder"] }
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# O_SYNC (write-through) on the raw partition device — see
# partition_bank_provider::open_payload_writer.
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper = "1"
sumo-offboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
coset = "0.3"
ciborium = "0.2"
tempfile = "3"
rand = "0.8"
# bank_provider's unit tests use the in-memory selector seams re-exported by
# machine-mgr; the re-declaration enables them for test builds only (cargo
# unifies dev-features there).
machine-mgr = { path = "../machine-mgr", features = ["test-seams"] }

[[bin]]
name = "vm-diagserver"
path = "src/main.rs"

[[example]]
name = "build_hsm_keys"
path = "../../example/build_hsm_keys.rs"
