[package]
name = "nv-store"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[features]
# Expose the in-memory selector test seams (`InMemorySelectorStore` /
# `TestSigner`), and also the `slots` fixture names (`slots::OS` &c — the
# reference slot layout tests read by name). For test builds only — downstream
# crates enable it via a [dev-dependencies] re-declaration, so production
# builds never see the seams.
test-seams = []
