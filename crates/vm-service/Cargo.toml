[package]
name = "vm-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "io-util"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
tracing = "0.1"
# Fleet logging init: sumo_log::init_tracing installs the recorder + the
# tracing→score_log capture bridge. Sibling crate → path dep.
sumo-log = { path = "../platform-integration/sumo-log" }
vm-devices = { path = "../vm-devices", features = ["http-transport"] }

[features]
qnx = []

[dev-dependencies]
tempfile = "3"

[lib]
name = "vm_service"
path = "src/lib.rs"

[[bin]]
name = "vm-service"
path = "src/main.rs"
