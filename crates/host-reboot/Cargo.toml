[package]
name = "host-reboot"
version = "0.1.0"
edition = "2021"
description = "The once-guarded reboot deadman that resets a node even when teardown wedges, plus the two reset mechanisms it can fire: a QNX kernel-direct sysmgr_reboot and a process exit under a respawn supervisor. Depends on machine-contract, libc and tracing and nothing else, so a node that needs to reset itself does not link a SOVD server to do it."

[dependencies]
# The only three. `machine-contract` for the `HostReboot` seam the deadman fires
# and a board can implement out of tree (it is the contract crate — dep-light by
# its own guard); `libc` for the QNX privity + sync + the two `extern "C"` system
# calls; `tracing` because a reset that does not fire must leave a log line — the
# whole design is "never take the process down, always leave evidence".
machine-contract = { path = "../machine-contract" }
libc = "0.2"
tracing = "0.1"
