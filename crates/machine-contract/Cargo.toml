[package]
name = "machine-contract"
version = "0.1.0"
edition = "2021"
description = "Shared machine contract — the synchronous BankProvider / BankActivator / Deactivator / ImageRecord traits plus ResetKind and the bank record types. Implemented in-tree by component-mgr and host-os-mgr and out-of-tree by every platform machine manager, so a platform impl needs neither SOVDd nor an async runtime to satisfy the seam."

[dependencies]
nv-store = { path = "../nv-store" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
