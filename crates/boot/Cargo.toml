[package]
name = "vm-boot"
version = "0.1.0"
edition = "2021"

[dependencies]
nv-store = { path = "../nv-store" }
sha2 = "0.10"

[dev-dependencies]
# The tests use nv-store's in-memory selector seams and its `slots` fixture
# names; the re-declaration enables them for test builds only (cargo unifies
# dev-features there).
nv-store = { path = "../nv-store", features = ["test-seams"] }

[[bin]]
name = "vm-boot"
path = "src/main.rs"
