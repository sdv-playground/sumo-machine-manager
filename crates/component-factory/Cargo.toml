[package]
name = "component-factory"
version = "0.1.0"
edition = "2021"
description = "Config-driven component construction for sumo machine manager"

[dependencies]
machine-mgr = { path = "../machine-mgr" }
nv-store = { path = "../nv-store" }
component-mgr = { path = "../component-mgr" }
app-mgr = { path = "../app-mgr" }
hsm = { path = "../hsm", features = ["crypto"] }
# Inline (not a [dependencies.sovd-core] table) on purpose: the workspace
# tag-consistency guard requires the git and tag keys on ONE line, so a
# multi-line table is invisible to it and could drift off the pin unnoticed.
sovd-core = { git = "https://github.com/sdv-playground/SOVDd.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
# The spec's own wire format — the defaults tests parse the YAML a platform
# profile actually ships, not a hand-built struct literal.
serde_yaml = "0.9"

[features]
# Forward container/OCI support to the crates that own it, so a binary composed
# through this factory can turn containers on with a single flag. Nothing in the
# factory itself is gated — it builds no container component today; the
# container-image route lives in component-mgr's app install router. OFF by
# default — see app-mgr's `container` comment for why.
container = ["component-mgr/container", "app-mgr/container"]
