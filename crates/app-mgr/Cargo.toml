[package]
name = "app-mgr"
version = "0.1.0"
edition = "2021"
description = "Self-updating application component — filesystem A/B banks with NV-backed state"

[dependencies]
nv-store = { path = "../nv-store" }
machine-mgr = { path = "../machine-mgr" }
async-trait = "0.1"
tracing = "0.1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
futures = "0.3"
bytes = "1"
sumo-codec = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }
sumo-onboard = { git = "https://github.com/tr-sdv-sandbox/sumo-rs.git", tag = "v0.1.3" }

[features]
# Container/OCI image updates: `docker_image::ContainerImageComponent` validates
# a detached `#container-image` payload and imports it into Docker, Podman, or
# containerd. Pulls in no new dependency — the runtimes are driven by shelling
# out to their CLIs (`docker`/`podman`/`ctr`, plus `tar`/`gzip`), so the feature
# only adds code (the crate's `sha2`/`bytes`/`sumo-codec`/`sumo-onboard` deps go
# unused while it is off).
# OFF by default: a target with no container runtime has no use for the import
# paths, so vendored/upstream builds that ship containers opt in instead.
container = []

[dev-dependencies]
tempfile = "3"
